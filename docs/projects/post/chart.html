<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>해협 우편선 · 항해 작업지</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f0e5;color:#172f36;font:16px/1.55 "Malgun Gothic",sans-serif}main{max-width:900px;margin:auto;padding:30px 22px 70px}header{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap}h1{font-size:clamp(28px,5vw,44px);margin:0}h2{font-size:19px}a{color:#185d5b}button,a.action{font:inherit;border:1px solid #567674;background:#fcfbf5;color:#173c3d;border-radius:5px;min-height:42px;padding:6px 14px;text-decoration:none;cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #af5213;outline-offset:3px}.group{display:flex;gap:7px;flex-wrap:wrap}.rule{padding:10px 0;border-bottom:1px solid #abbcb0}svg{display:block;max-width:100%;width:100%;height:auto;border-radius:8px;background:#cde1da}table{width:100%;border-collapse:collapse;margin:8px 0 15px}td,th{text-align:left;padding:7px;border-bottom:1px solid #b7c8bd}#note{min-height:1.5em;color:#79420f}label{display:inline-flex;gap:8px;align-items:center}select{font:inherit}</style></head><body><main><header><h1>항해 작업지</h1><a href="../../?project=post">항구로</a></header><p>물때를 바꿔 도착 시각을 예측합니다. 출발 위상 0에서 짠 항로는 항구로 옮겨 운항할 수 있습니다.</p><svg id="map" viewBox="0 0 760 300" role="img" aria-label="다섯 기항지와 항로, 주황색 점선은 얕은 수로"></svg><p class="rule"><label>출발 위상 <select id="phase" aria-label="출발 위상"></select></label></p><h2>다음 기항지</h2><div class="group" id="choices"></div><p id="note" role="status"></p><table><thead><tr><th>구간</th><th>출발</th><th>도착</th><th>배달</th></tr></thead><tbody id="rows"></tbody></table><div class="group"><button id="undo">한 칸 취소</button><button id="clear">작업지 비우기</button><button id="save">예정표 저장</button><a id="play" class="action" href="../../?project=post">이 항로로 항구 열기</a></div></main><script type="module" src="chart.mjs"></script></body></html>
